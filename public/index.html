<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">

  <script>

        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';

          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);

    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };

  <title>Sheep countrr</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐑</text></svg>">

  <script src="https://social-vibecoding.usernodelabs.org/usernode-bridge/v1/bridge.js"></script>

  <!-- Tailwind, precompiled for this app by the Dockerfile's builder stage
       from tailwind.config.js — see that file for details. -->
  <link rel="stylesheet" href="/tailwind.css">

  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js"
    }
  }
  </script>

  <style>
    /* The `hidden` attribute and a Tailwind display utility (e.g. `flex`)
       on the same element tie in specificity; Tailwind's stylesheet loads
       after the browser default, so the utility would otherwise win and
       the element would stay visible. Force `hidden` to actually hide. */
    [hidden] { display: none !important; }
    html, body { height: 100%; overscroll-behavior: none; }
    body { touch-action: manipulation; }
    #scene-root { touch-action: none; user-select: none; }
    #scene-root canvas.sheep-canvas { display: block; width: 100%; height: 100%; }

    .sheep-fallback-field {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
      align-content: center;
      gap: 18px;
      padding: 24px;
      background: linear-gradient(180deg, #8fd3ff 0%, #8fd3ff 45%, #6fbf4f 45%, #58a83e 100%);
    }
    .sheep-card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 9999px;
      background: #f8f7f2;
      border: 3px solid rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      box-shadow: 0 6px 0 rgba(0,0,0,0.12);
    }
    .sheep-card.is-counted { background: #fef3c7; border-color: #f59e0b; }
    .sheep-card-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 1.75rem;
      height: 1.75rem;
      border-radius: 9999px;
      background: #7c3aed;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
    }

    .visually-hidden {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    #grownups-btn {
      padding-top: var(--un-safe-inset-top, env(safe-area-inset-top, 0px));
    }
    #count-badge {
      padding-top: var(--un-safe-inset-top, env(safe-area-inset-top, 0px));
    }
    #celebration, #grownups-panel {
      padding-bottom: var(--un-safe-inset-bottom, env(safe-area-inset-bottom, 0px));
    }
  </style>
</head>
<body class="bg-sky-200 text-zinc-900 h-full overflow-hidden">
  <div class="relative h-full w-full">

    <!-- The 3D pasture (or the card fallback) fills the screen. -->
    <div id="scene-root" class="absolute inset-0"></div>

    <!-- Big readable count, top center. -->
    <div id="count-badge" class="pointer-events-none absolute top-0 inset-x-0 flex justify-center pt-4">
      <div class="pointer-events-auto rounded-3xl bg-white/90 shadow-lg px-8 py-3 flex flex-col items-center min-w-[7rem]" aria-live="polite">
        <span id="count-display" class="text-6xl font-black leading-none text-violet-700 tabular-nums">0</span>
        <span id="count-word" class="text-base font-semibold text-violet-500 tracking-wide">Zero</span>
      </div>
    </div>

    <!-- Small, deliberately unlabeled corner control for grown-ups. A
         quick tap does nothing; only a ~1.5s press-and-hold opens the
         panel, so a curious child mashing the screen can't get in. -->
    <button id="grownups-btn" type="button"
      class="absolute top-2 right-2 w-11 h-11 rounded-full bg-white/70 text-zinc-500 flex items-center justify-center text-lg"
      aria-label="Grown-ups: press and hold to open settings">
      ⚙
    </button>

    <!-- Hidden accessible mirror of every sheep, for keyboard/screen-reader use. -->
    <div id="a11y-sheep-list" class="visually-hidden"></div>

    <!-- Celebration panel, shown once every sheep in the round is counted. -->
    <div id="celebration" hidden class="absolute inset-0 flex items-center justify-center bg-black/30 p-6">
      <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-xs w-full text-center flex flex-col items-center gap-4">
        <div class="text-5xl" aria-hidden="true">🎉🐑🎉</div>
        <p class="text-2xl font-extrabold text-violet-700">You counted <span id="celebration-total">5</span> sheep!</p>
        <button id="count-again-btn" type="button"
          class="w-full rounded-2xl bg-violet-600 hover:bg-violet-500 active:scale-95 transition-all text-white text-xl font-bold py-4">
          Count again
        </button>
      </div>
    </div>

    <!-- Grown-ups panel: sound toggle, herd size, reset, progress. -->
    <div id="grownups-panel" hidden class="absolute inset-0 flex items-end sm:items-center justify-center bg-black/40 p-4">
      <div class="bg-white rounded-3xl shadow-2xl p-6 max-w-sm w-full flex flex-col gap-5">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-bold text-zinc-800">Grown-ups</h2>
          <button id="grownups-close" type="button" class="w-9 h-9 rounded-full bg-zinc-100 text-zinc-500 flex items-center justify-center" aria-label="Close">✕</button>
        </div>

        <label class="flex items-center justify-between gap-3">
          <span class="text-sm font-medium text-zinc-700">Sound</span>
          <input id="sound-toggle" type="checkbox" class="w-6 h-6 accent-violet-600">
        </label>

        <label class="flex items-center justify-between gap-3">
          <span class="text-sm font-medium text-zinc-700">How many sheep</span>
          <select id="herd-size-input" class="rounded-lg border border-zinc-300 px-2 py-1 text-sm">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </label>

        <div class="rounded-xl bg-zinc-50 p-3 text-sm text-zinc-600 flex flex-col gap-1">
          <div class="flex justify-between"><span>Best round</span><span id="best-value" class="font-semibold text-zinc-800">0</span></div>
          <div class="flex justify-between"><span>Sheep counted (you)</span><span id="total-value" class="font-semibold text-zinc-800">0</span></div>
          <div class="flex justify-between"><span>Sheep counted (everyone)</span><span id="community-value" class="font-semibold text-zinc-800">0</span></div>
        </div>

        <button id="start-over-btn" type="button" class="w-full rounded-2xl bg-zinc-100 hover:bg-zinc-200 text-zinc-700 font-semibold py-3">
          Start over
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
